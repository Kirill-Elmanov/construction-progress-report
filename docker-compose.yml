# ═══════════════════════════════════════════════════════════
# РОСТ-Отчёт — локальное окружение (Спринт 0)
# PostgreSQL 16 + MinIO (эмуляция Object Storage для фото/PDF)
# Redis НЕТ — сессии stateless JWT (решение ТЗ 4.6)
# ═══════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    container_name: rost-postgres
    environment:
      POSTGRES_USER: rost
      POSTGRES_PASSWORD: rost_dev_password
      POSTGRES_DB: rost_report
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rost -d rost_report"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Эмуляция Yandex Object Storage (S3-совместимый API)
  minio:
    image: minio/minio:latest
    container_name: rost-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rost-dev
      MINIO_ROOT_PASSWORD: rost-dev-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый init: создаём бакеты rost-photos / rost-pdf
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 rost-dev rost-dev-secret &&
      mc mb --ignore-existing local/rost-photos &&
      mc mb --ignore-existing local/rost-pdf &&
      echo '✅ Buckets ready: rost-photos, rost-pdf'
      "

volumes:
  pg_data:
  minio_data: